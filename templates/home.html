<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FWI Prediction</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background: linear-gradient(135deg,#0f172a,#1e293b);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            background:white;
            padding:30px;
            border-radius:15px;
            width:450px;
            box-shadow:0 10px 25px rgba(0,0,0,0.3);
        }

        h1{
            text-align:center;
            margin-bottom:20px;
            color:#1e293b;
        }

        input{
            width:100%;
            padding:12px;
            margin:8px 0;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:15px;
        }

        input:focus{
            outline:none;
            border-color:#2563eb;
        }

        button{
            width:100%;
            padding:12px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
            margin-top:10px;
            transition:0.3s;
        }

        button:hover{
            background:#1d4ed8;
        }

        .result{
            margin-top:20px;
            text-align:center;
            font-size:20px;
            font-weight:bold;
            color:#16a34a;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🔥 FWI Prediction</h1>

    <!-- Main Input For Receiving Query to our ML -->

    <form action="{{ url_for('predict_datapoint') }}" method="post">

        <input type="text" name="Temperature" placeholder="Temperature" required="required" />

        <input type="text" name="RH" placeholder="RH" required="required" />

        <input type="text" name="Ws" placeholder="Ws" required="required" />

        <input type="text" name="Rain" placeholder="Rain" required="required" />

        <input type="text" name="FFMC" placeholder="FFMC" required="required" />

        <input type="text" name="DMC" placeholder="DMC" required="required" />

        <input type="text" name="ISI" placeholder="ISI" required="required" />

        <input type="text" name="Classes" placeholder="Classes" required="required" />

        <input type="text" name="Region" placeholder="Region" required="required" />

        <button type="submit">
            Predict
        </button>

    </form>

    <div class="result">
        THE FWI prediction is {{results}}
    </div>

</div>

</body>
</html>
